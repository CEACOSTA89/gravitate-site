  var STORE = 'protect-or-destroy:pw';
  var form = document.getElementById('gate');
  var input = document.getElementById('pw');
  var button = document.getElementById('go');
  var msg = document.getElementById('msg');

  function bytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  // Case, spaces and hyphens are ignored so the password is easy to type on a phone.
  function normalize(pw) { return pw.toLowerCase().replace(/[^a-z0-9]/g, ''); }

  async function decrypt(pw) {
    var material = await crypto.subtle.importKey('raw', new TextEncoder().encode(normalize(pw)),
      'PBKDF2', false, ['deriveKey']);
    var passKey = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
      material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    // Each invited person has their own slot holding the page key, locked with their password.
    var pageKey = null;
    for (var i = 0; i < PAYLOAD.slots.length && !pageKey; i++) {
      try {
        var rawKey = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.slots[i].iv) }, passKey, bytes(PAYLOAD.slots[i].key));
        pageKey = await crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt']);
      } catch (e) { /* not this slot */ }
    }
    if (!pageKey) throw new Error('no matching password');
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.iv) }, pageKey, bytes(PAYLOAD.data));
    return new TextDecoder().decode(plain);
  }

  async function unlock(pw, silent) {
    if (!window.crypto || !crypto.subtle) {
      msg.textContent = 'This browser cannot open the page (it needs a secure https connection).';
      return;
    }
    button.disabled = true;
    if (!silent) msg.textContent = '';
    var html;
    try {
      html = await decrypt(pw);
    } catch (e) {
      button.disabled = false;
      try { sessionStorage.removeItem(STORE); } catch (e2) {}
      if (!silent) { msg.textContent = 'That password did not work.'; input.select(); }
      return;
    }
    try { sessionStorage.setItem(STORE, pw); } catch (e) {}   // this tab only, so a reload does not ask again
    document.open();
    document.write(html);
    document.close();
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); unlock(input.value, false); });

  var saved = null;
  try { saved = sessionStorage.getItem(STORE); } catch (e) {}
  if (saved) unlock(saved, true);
})();
