      try {
        var rawKey = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.slots[i].iv) }, passKey, bytes(PAYLOAD.slots[i].key));
        pageKey = await crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt']);
      } catch (e) { /* not this slot */ }
    }
    if (!pageKey) throw new Error('no matching password');
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.iv) }, pageKey, bytes(PAYLOAD.data));
    return new TextDecoder().decode(plain);
  }

  async function unlock(pw, silent) {
    if (!window.crypto || !crypto.subtle) {
      msg.textContent = 'This browser cannot open the page (it needs a secure https connection).';
      return;
    }
    button.disabled = true;
    if (!silent) msg.textContent = '';
    var html;
    try {
      html = await decrypt(pw);
    } catch (e) {
      button.disabled = false;
      try { sessionStorage.removeItem(STORE); } catch (e2) {}
      if (!silent) { msg.textContent = 'That password did not work.'; input.select(); }
      return;
    }
    try { sessionStorage.setItem(STORE, pw); } catch (e) {}   // this tab only, so a reload does not ask again
    document.open();
    document.write(html);
    document.close();
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); unlock(input.value, false); });

  var saved = null;
  try { saved = sessionStorage.getItem(STORE); } catch (e) {}
  if (saved) unlock(saved, true);
})();
</script>
</body>
</html>
